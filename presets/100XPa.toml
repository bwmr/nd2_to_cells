# Tracking parameters for P. aeruginosa at 100x (60 nm/px).
# Effective SuperSegger CONST.trackOpti values of a superSeggerGui run with the
# 100XPa preset. Differs from 100XEc only in SMALL_AREA_MERGE (30 vs 50).

[tracking]
da_max           = 0.3
da_min           = -0.2
small_area_merge = 30
remove_stray     = false
min_cell_age     = 3
