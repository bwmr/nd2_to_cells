# Tracking parameters for E. coli at 100x (60 nm/px).
# Effective SuperSegger CONST.trackOpti values of a superSeggerGui run with the
# 100XEc preset (settings/100XEc.mat + loadConstants.m + GUI defaults).

[tracking]
# Area-change limits (DA_MIN / DA_MAX). Normalised area change outside
# [da_min, da_max] flags a linking error (ehist), and the division and merge
# tests in errorRez require the change to lie inside.
da_max = 0.3
da_min = -0.2

# Two regions that map back to the same cell are merged if either is smaller
# than this (pixels), among other conditions (SMALL_AREA_MERGE).
small_area_merge = 50

# Delete regions with no backward and no forward map (REMOVE_STRAY). Off in
# SuperSegger: loadConstants does not copy it from the preset, and the GUI
# checkbox defaults to off.
remove_stray = false

# A complete cell cycle (Cell{ID}.h5) divides at least this many frames after
# its birth, i.e. spans min_cell_age + 1 frames or more (MIN_CELL_AGE;
# superSeggerGui default 3).
min_cell_age = 3
